[package]
name = "arcella-broker"
version = "0.1.0"
authors = ["ArcellaTeam"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ArcellaTeam/arcella-broker"
description = "High-performance message routing and local recipient registry for the Arcella WebAssembly application platform."
keywords = ["wasm", "webassembly", "messaging", "routing", "arcella"]
categories = ["network-programming", "asynchronous", "wasm"]

[lib]
name = "arcella_broker"
path = "src/lib.rs"

[[bin]]
name = "arcella-broker"
path = "src/bin/arcella-broker.rs"
required-features = ["server"]

[dependencies]
anyhow = "1"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
dashmap = "6.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"


[features]
default = ["client"]
client = []
server = ["client"] 